name: book_tracker
description: A book learning progress tracker.
publish_to: 'none'

version: 1.4.0+5


environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  table_calendar: ^3.1.2
  intl: ^0.19.0
  file_picker: ^10.1.9
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Launcher icon (#154). Regenerate the Android resources after changing the
# sources in assets/icon/: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true